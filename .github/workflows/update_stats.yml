name: Update GitHub Streak Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Generate streak stats
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python generate_stats.py
      
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet github_streak_stats.svg; then
            echo "No changes to commit"
          else
            git add github_streak_stats.svg
            git commit -m "Update streak stats [skip ci]"
            git push
          fi
